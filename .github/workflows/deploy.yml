name: Deploy ZEHNOX

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /opt/zehnox/app
            git fetch origin
            git reset --hard origin/main

            cd /opt/zehnox
            docker compose build
            docker compose up -d

            sleep 5
            curl -f http://127.0.0.1:3000/